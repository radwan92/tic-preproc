[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tic-preproc"
version = "0.1.0"
description = "TIC-80 cartridge preprocessor and include bundler"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

[project.scripts]
tic-preproc = "tic_preproc.cli:main"

[tool.setuptools]
packages = ["tic_preproc"]
